[package]
name = "tree-sitter-move"
description = "Move grammar for the tree-sitter parsing library"
version = "0.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "move"]
categories = ["parser-implementations", "text-editors"]
repository = "https://github.com/embe221ed/tree-sitter-move-sui"
edition = "2021"
license = "Apache-2.0"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "src/tree_sitter/*",
]

# standalone crate, deliberately outside the external-crates/move workspace
[workspace]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
# Track the CLI pinned in package.json: some scanner invariants (zero-width
# tokens) only surface on a runtime of the same generation as the generator.
tree-sitter = "0.26"
