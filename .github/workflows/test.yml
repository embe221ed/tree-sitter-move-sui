name: Parser tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Rust test toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup override set 1.93.1
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:fuzz
      - name: Check generated sources are current
        run: git diff --exit-code -- src/
